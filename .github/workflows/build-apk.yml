name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace -PNVIDIA_API_KEY="${NVIDIA_API_KEY}" 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: failure()
        run: |
          echo '## Gradle build diagnostics' >> "$GITHUB_STEP_SUMMARY"
          tail -250 build.log >> "$GITHUB_STEP_SUMMARY"
          grep -E "(^e: |FAILURE:|What went wrong|Execution failed)" build.log | tail -20 | while IFS= read -r line; do echo "::error file=build.log::$line"; done
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
